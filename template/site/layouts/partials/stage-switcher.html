{{- /* Links, not tabs: one page per stage; matrix.js appends the filters (the URL hash) to every link. */ -}}
<ul class="stage-switcher" aria-labelledby="nav-stage">
  {{- range $i, $stage := .data.stages }}
  {{- $href := printf "stages/%s/" $stage.slug | relURL }}
  <li><a href="{{ $href }}" data-stage-link="{{ $stage.slug }}"{{ if eq $href $.page.RelPermalink }} aria-current="page"{{ end }}>{{ $stage.name }}</a></li>
  {{- end }}
</ul>
