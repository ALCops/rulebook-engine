{{- $data := hugo.Data.rulebook -}}
<footer class="site-footer">
  <p>
    <span>Generated <time datetime="{{ $data.generatedAt }}">{{ $data.generatedAt }}</time></span>
    <span>engine <code>{{ $data.engineRef }}</code></span>
    {{- with $data.repository }}
    <span><a href="https://github.com/{{ . }}">{{ . }}</a></span>
    {{- end }}
    <span><a href="{{ "rulebook.json" | relURL }}"><code>rulebook.json</code></a></span>
    <span class="powered">Powered by <a href="https://alcops.dev">ALCops</a></span>
  </p>
</footer>
