# Refreshes ALCops/rulebook@preview, the bleeding-edge branch the canary rulebook follows (D53, docs/releasing.md): the
# engine's template/ plus .github/RELEASENOTES.copy.md, with the template references rewritten to preview (the engine
# references stay at main), committed only when something changed. The first run creates preview from the head of
# main. No tag, no release. Runs on every push to main that touches template/ or the release notes, and by hand.
# Authenticates as the ALCops deploy App (variable DEPLOY_APP_ID, secret DEPLOY_APP_PRIVATE_KEY).
# A dispatch with --ref <branch> runs this file from that branch and copies that branch's template/.
name: Refresh Template

on:
  push:
    branches: [ main ]
    paths:
      - 'template/**'
      - 'RELEASENOTES.md'
      - '.github/workflows/RefreshTemplate.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Refresh ALCops/rulebook@preview
        shell: pwsh
        env:
          DEPLOY_APP_ID: ${{ vars.DEPLOY_APP_ID }}
          DEPLOY_APP_PRIVATE_KEY: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}
        run: ./tools/deploy/Invoke-Deploy.ps1 -Mode refresh
