name: spike-a

# Throwaway workflow for spike (a), issue #19. Deleted before the pull request.

on:
  workflow_dispatch:
  push:
    branches: [ 'wp01/spike-a' ]

permissions:
  contents: read

env:
  TOOLS_VERSION: 18.0.43.1464
  FEED: https://pkgs.dev.azure.com/dynamicssmb2/DynamicsBCPublicFeeds/_packaging/MSSymbols/nuget/v3/flat2
  PAGES: https://arthurvdv.github.io/rulebook-spike-endpoint/v1/rulesets
  RAW: https://raw.githubusercontent.com/Arthurvdv/rulebook-spike-endpoint/main/v1/rulesets
  NXHOST: https://nonexistent.invalid/x.json

jobs:
  spike:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Environment
        run: |
          {
            echo "### Environment"
            echo '```'
            echo "ImageOS=$ImageOS ImageVersion=$ImageVersion"
            grep -E '^(PRETTY_NAME|VERSION_ID)=' /etc/os-release
            echo "dotnet --version: $(dotnet --version)"
            echo "strace: $(command -v strace || echo 'not installed')"
            echo "tcpdump: $(command -v tcpdump || echo 'not installed')"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Install strace if missing
        run: |
          if ! command -v strace; then
            start=$(date +%s)
            sudo apt-get install -y strace > apt.log 2>&1 || { sudo apt-get update > /dev/null 2>&1; sudo apt-get install -y strace > apt.log 2>&1; }
            echo "strace installed via apt-get in $(( $(date +%s) - start ))s: $(strace -V | head -1)" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "strace preinstalled: $(strace -V | head -1)" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          echo "tcpdump: $(tcpdump --version 2>&1 | head -1)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Endpoints reachable and headers
        run: |
          for u in "$PAGES/recommended.ci.ruleset.json" "$RAW/recommended.ci.ruleset.json"; do
            for i in $(seq 1 30); do
              code=$(curl -s -o /dev/null -w '%{http_code}' "$u")
              [ "$code" = 200 ] && break
              sleep 10
            done
            echo "$u -> $code after $i attempt(s)"
          done
          {
            echo "### Headers (curl -sI from the runner)"
            echo '```'
            for u in "$PAGES/recommended.ci.ruleset.json" "$RAW/recommended.ci.ruleset.json" "$PAGES/does-not-exist.ruleset.json" "$RAW/does-not-exist.ruleset.json"; do
              echo "=== $u"
              curl -sI "$u" | grep -iE '^(HTTP|content-type|cache-control|location|etag|age|x-cache|server|via)' || true
            done
            echo "=== curl -sL, redirects followed"
            for u in "$PAGES/recommended.ci.ruleset.json" "$RAW/recommended.ci.ruleset.json"; do
              curl -sL -o /dev/null -w "%{http_code} redirects=%{num_redirects} http=%{http_version} ip=%{remote_ip} $u\n" "$u"
            done
            echo "=== getent ahosts"
            for h in arthurvdv.github.io raw.githubusercontent.com nonexistent.invalid; do echo "$h: $(getent ahosts $h | awk '{print $1}' | sort -u | tr '\n' ' ')"; done
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Install tool
        run: |
          dotnet tool install --global Microsoft.Dynamics.BusinessCentral.Development.Tools --version "$TOOLS_VERSION"
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
          AL_BIN=$(dirname "$(find ~/.dotnet/tools/.store/microsoft.dynamics.businesscentral.development.tools -path '*/tools/net10.0/any/alc.dll' | head -1)")
          if [ ! -f "$AL_BIN/alc.dll" ]; then echo "::error::alc.dll not found in '$AL_BIN'"; exit 1; fi
          echo "AL_BIN=$AL_BIN" >> "$GITHUB_ENV"
          echo "AL_BIN=$AL_BIN" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Symbols and fixture
        run: |
          V=$(curl -fsS "$FEED/microsoft.platform.symbols/index.json" \
            | jq -r '[.versions[] | select(startswith("28.") and (contains("-") | not))]
                     | sort_by(split(".") | map(tonumber)) | last // empty')
          if [ -z "$V" ]; then echo "::error::no stable 28.x platform symbols on the feed"; exit 1; fi
          curl -fsSL -o platform.nupkg "$FEED/microsoft.platform.symbols/$V/microsoft.platform.symbols.$V.nupkg"
          mkdir -p fixture/.alpackages fixture/src fixture/.rulebook
          unzip -o -j platform.nupkg '*.app' -d fixture/.alpackages
          echo "al $(al --version), platform symbols $V" | tee -a "$GITHUB_STEP_SUMMARY"
          cat > fixture/app.json <<'J'
          {
            "id": "6f1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d",
            "name": "Spike",
            "publisher": "Rulebook Spike",
            "version": "1.0.0.0",
            "platform": "28.0.0.0",
            "runtime": "17.0",
            "idRanges": [ { "from": 50000, "to": 50099 } ],
            "target": "Cloud"
          }
          J
          cat > fixture/src/Spike.Codeunit.al <<'A'
          codeunit 50000 "Spike"
          {
              procedure Probe()
              var
                  Unused: Integer;
              begin
              end;
          }
          A

      - name: Helpers
        run: |
          # skel.sh <include-url> <own-rules yes|no>: writes the ARCHITECTURE 6.3 skeleton to fixture/.rulebook/ci.ruleset.json
          cat > "$RUNNER_TEMP/skel.sh" <<'SH'
          url="$1"; own="$2"
          if [ "$own" = yes ]; then rules='[ { "id": "AA0137", "action": "None" } ]'; else rules='[]'; fi
          printf '{\n  "name": "Rulebook Spike / CI",\n  "description": "Includes the org endpoint. Add project exceptions to rules; they override the endpoint.",\n  "includedRuleSets": [\n    { "action": "Default", "path": "%s" }\n  ],\n  "rules": %s\n}\n' "$url" "$rules" > "$GITHUB_WORKSPACE/fixture/.rulebook/ci.ruleset.json"
          SH
          # run.sh <host> <scenario> <ruleset-or-empty> <flag yes|no>: one compile under strace and tcpdump
          cat > "$RUNNER_TEMP/run.sh" <<'SH'
          host="$1"; scen="$2"; rs="$3"; flag="$4"
          d="$RUNNER_TEMP/out/$host-$(echo "$scen" | tr -c 'a-zA-Z0-9' '_')"; mkdir -p "$d"; app="$d/out.app"; rm -f "$app"
          args=(compile /project:fixture /packagecachepath:fixture/.alpackages "/out:$app"
                "/analyzer:$AL_BIN/Microsoft.Dynamics.Nav.CodeCop.dll"
                "/analyzer:$AL_BIN/Microsoft.Dynamics.Nav.UICop.dll"
                "/analyzer:$AL_BIN/Microsoft.Dynamics.Nav.PerTenantExtensionCop.dll")
          [ -n "$rs" ] && args+=("/ruleset:$rs")
          [ "$flag" = yes ] && args+=(/enableexternalrulesets)
          echo "::group::$host / $scen"
          [ -f "$rs" ] && { echo "--- skeleton $rs"; cat "$rs"; }
          sudo tcpdump -i any -nn -U -w "$d/cap.pcap" 'tcp[tcpflags] & tcp-syn != 0 and tcp[tcpflags] & tcp-ack == 0 and dst port 443' > "$d/tcpdump.err" 2>&1 &
          sleep 2
          echo "+ al ${args[*]}"
          start=$(date +%s.%N)
          strace -f -qq -e trace=connect -o "$d/strace.log" al "${args[@]}" > "$d/compile.log" 2>&1
          rc=$?
          end=$(date +%s.%N)
          sleep 2
          sudo pkill -INT -x tcpdump || true
          wait || true
          wall=$(awk "BEGIN{printf \"%.1f\", $end-$start}")
          cat "$d/compile.log"
          al1033=$(grep -q AL1033 "$d/compile.log" && echo yes || echo no)
          al0767=$(grep -q AL0767 "$d/compile.log" && echo yes || echo no)
          al1003=$(grep -c AL1003 "$d/compile.log")
          sev=$(grep -oE '(error|warning|info|hidden) AA0137' "$d/compile.log" | head -1 | cut -d' ' -f1)
          sev=${sev:-absent}
          appw=$([ -f "$app" ] && echo yes || echo no)
          c443=$(grep -c 'htons(443)' "$d/strace.log")
          c53=$(grep -c 'htons(53)' "$d/strace.log")
          dst443=$(grep 'htons(443)' "$d/strace.log" | grep -oE 'inet_(addr|pton)\([^)]*\)' | tr '\n' ' ')
          # -i any sees each SYN on eth0 and ens1; count distinct SYNs by source port, destination and sequence number
          syn_raw=$(sudo tcpdump -nn -r "$d/cap.pcap" 2>/dev/null | wc -l)
          syn_all=$(sudo tcpdump -nn -r "$d/cap.pcap" 2>/dev/null | awk '{print $5, $7, $11}' | sort -u | wc -l)
          syn_gh=$(sudo tcpdump -nn -r "$d/cap.pcap" 'dst net 185.199.108.0/22' 2>/dev/null | awk '{print $5, $7, $11}' | sort -u | wc -l)
          echo "--- strace connects to ports 443 and 53"; grep -E 'htons\((443|53)\)' "$d/strace.log" || echo "(none)"
          echo "--- other strace connects with an inet address"; grep -E 'AF_INET' "$d/strace.log" | grep -vE 'htons\((443|53)\)' || echo "(none)"
          echo "--- tcpdump SYNs to :443"; sudo tcpdump -nn -r "$d/cap.pcap" 2>/dev/null || true
          echo "::endgroup::"
          [ "$al1003" != 0 ] && echo "::error::AL1003 in $host/$scen (analyzers failed to load)"
          row="| $host | $scen | $rc | $al1033 | $al0767 | $sev | $appw | $c443 | $syn_gh ($syn_all, $syn_raw captured) | $c53 | ${wall}s |"
          echo "RESULT $row dst443=[$dst443]"
          echo "$row" >> "$GITHUB_STEP_SUMMARY"
          exit 0
          SH
          chmod +x "$RUNNER_TEMP/run.sh" "$RUNNER_TEMP/skel.sh"
          {
            echo "### Results"
            echo
            echo "| host | scenario | exit code | AL1033 | AL0767 | AA0137 | .app written | connects :443 (strace) | distinct SYNs to 185.199.108.0/22 (all :443, packets captured) | connects :53 (strace) | wall time |"
            echo "|---|---|---|---|---|---|---|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Compile
        run: |
          R="$RUNNER_TEMP/run.sh"; S="$RUNNER_TEMP/skel.sh"; SK="$GITHUB_WORKSPACE/fixture/.rulebook/ci.ruleset.json"
          $R none "control: no ruleset" "" no
          for host in pages raw; do
            if [ $host = pages ]; then B="$PAGES"; else B="$RAW"; fi
            $R $host "control: URL, no flag" "$B/recommended.ci.ruleset.json" no
            $R $host "control: 404 URL, flag" "$B/does-not-exist.ruleset.json" yes
            $R $host "direct URL, flag" "$B/recommended.ci.ruleset.json" yes
            $S "$B/recommended.ci.ruleset.json" no
            $R $host "skeleton, include only (rules: [])" "$SK" yes
            $S "$B/recommended.ci.ruleset.json" yes
            $R $host "skeleton, own AA0137 None" "$SK" yes
            $R $host "skeleton, own AA0137 None, no flag" "$SK" no
            $S "$B/broken.ruleset.json" yes
            $R $host "skeleton, include broken" "$SK" yes
            $S "$B/does-not-exist.ruleset.json" yes
            $R $host "skeleton, include 404" "$SK" yes
          done
          $S "$NXHOST" yes
          $R nxhost "skeleton, include non-existent host" "$SK" yes
          $S "$NXHOST" no
          $R nxhost "skeleton, include non-existent host (rules: [])" "$SK" yes
