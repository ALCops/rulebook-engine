name: spike-h

on:
  workflow_dispatch:
  push:
    branches: ['wp01/spike-h']

permissions:
  contents: read

jobs:
  hugo:
    name: hugo ${{ matrix.hugo }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        hugo: ['0.167.0', '0.165.0', '0.126.0']
    env:
      HUGO_VERSION: ${{ matrix.hugo }}
      SITE: .github/spike-h/site
    steps:
      - uses: actions/checkout@v4

      - name: Install Hugo extended ${{ matrix.hugo }}
        run: |
          set -euo pipefail
          echo "runner: $ImageOS $ImageVersion" | tee -a "$GITHUB_STEP_SUMMARY"
          cd "$RUNNER_TEMP"
          deb="hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          base="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          start=$(date +%s.%N)
          curl -sSfLO "$base/$deb"
          curl -sSfLO "$base/hugo_${HUGO_VERSION}_checksums.txt"
          grep " ${deb}\$" "hugo_${HUGO_VERSION}_checksums.txt" | sha256sum -c - | tee -a "$GITHUB_STEP_SUMMARY"
          sudo dpkg -i "$deb" > /dev/null
          end=$(date +%s.%N)
          echo "install seconds: $(echo "$end - $start" | bc)" | tee -a "$GITHUB_STEP_SUMMARY"
          hugo version | tee -a "$GITHUB_STEP_SUMMARY"
          echo "rulebook.json bytes: $(stat -c %s "$GITHUB_WORKSPACE/$SITE/data/rulebook.json"), rules: $(jq '.rules | length' "$GITHUB_WORKSPACE/$SITE/data/rulebook.json")" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Build per adapter variant
        run: |
          set -uo pipefail
          {
            echo "### Hugo $HUGO_VERSION"
            echo
            echo "| Variant | Exit | Probe | Pages | index.html | public | t1 | t2 | t3 | median |"
            echo "|---|---|---|---|---|---|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for v in data readfile resources hugodata; do
            echo "::group::variant $v"
            times=()
            rc=0
            for i in 1 2 3; do
              rm -rf "$SITE/public" "$SITE/resources" "$SITE/.hugo_build.lock"
              start=$(date +%s.%N)
              hugo --source "$SITE" --contentDir "content-$v" --printPathWarnings > "build-$v-$i.log" 2>&1
              rc=$?
              end=$(date +%s.%N)
              times+=("$(echo "$end - $start" | bc | awk '{printf "%.3f", $1}')")
              echo "--- run $i (exit $rc, ${times[-1]} s)"
              cat "build-$v-$i.log"
            done
            median=$(printf '%s\n' "${times[@]}" | sort -n | sed -n 2p)
            probe=$(grep -o 'spike-h probe [^ ]* [^ ]*' "build-$v-3.log" | head -1 | cut -d' ' -f4)
            pages=$(grep -E '^ *Pages ' "build-$v-3.log" | grep -oE '[0-9]+' | head -1)
            if [ -d "$SITE/public" ]; then
              idx=$(find "$SITE/public" -name index.html | wc -l)
              size=$(du -sh "$SITE/public" | cut -f1)
            else
              idx=-; size=-
            fi
            echo "du -sh public: $size; index.html files: $idx"
            echo "| $v | $rc | ${probe:-none} | ${pages:--} | $idx | $size | ${times[0]} | ${times[1]} | ${times[2]} | $median |" >> "$GITHUB_STEP_SUMMARY"
            echo "--- templateMetrics"
            rm -rf "$SITE/public" "$SITE/resources" "$SITE/.hugo_build.lock"
            hugo --source "$SITE" --contentDir "content-$v" --printPathWarnings --templateMetrics --templateMetricsHints 2>&1 | head -40
            echo "::endgroup::"
          done
          {
            echo
            echo "<details><summary>Build output, variant data, run 3</summary>"
            echo
            echo '```'
            cat build-data-3.log
            echo '```'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
          for v in readfile resources hugodata; do
            { echo; echo "<details><summary>Build output, variant $v, run 3</summary>"; echo; echo '```'; cat "build-$v-3.log"; echo '```'; echo; echo "</details>"; } >> "$GITHUB_STEP_SUMMARY"
          done
