name: CI

on:
  pull_request:
  push:
    branches: [ main, 'v*' ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install PSScriptAnalyzer and Pester
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Force -Scope CurrentUser -SkipPublisherCheck
          Install-Module Pester -RequiredVersion 6.2.0 -Force -Scope CurrentUser -SkipPublisherCheck

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          $results | Format-Table RuleName, Severity, ScriptName, Line, Message -AutoSize | Out-String -Width 220 | Write-Host
          if ($results.Count -gt 0) { Write-Host "::error::PSScriptAnalyzer reported $($results.Count) finding(s)"; exit 1 }
          Write-Host 'PSScriptAnalyzer: no findings'

      - name: Pester
        shell: pwsh
        run: |
          Import-Module Pester -MinimumVersion 6.0
          $config = New-PesterConfiguration
          $config.Run.Path = 'tests'
          $config.Run.Exit = $true
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputFormat = 'NUnitXml'
          $config.TestResult.OutputPath = 'testResults.xml'
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: testResults
          path: testResults.xml
          if-no-files-found: warn

  validate-action:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate valid-minimal (must pass)
        uses: ./actions/Validate
        with:
          repositoryRoot: tests/fixtures/repos/valid-minimal

      - name: Validate stale-endpoints (must fail)
        id: stale
        continue-on-error: true
        uses: ./actions/Validate
        with:
          repositoryRoot: tests/fixtures/repos/stale-endpoints

      - name: Require the stale-endpoints failure
        if: steps.stale.outcome != 'failure'
        shell: pwsh
        run: |
          Write-Host '::error::Validate passed on tests/fixtures/repos/stale-endpoints'
          exit 1
