name: CI

on:
  pull_request:
  push:
    branches: [ main, 'v*' ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install PSScriptAnalyzer and Pester
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Force -Scope CurrentUser -SkipPublisherCheck
          Install-Module Pester -RequiredVersion 6.2.0 -Force -Scope CurrentUser -SkipPublisherCheck

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          $results | Format-Table RuleName, Severity, ScriptName, Line, Message -AutoSize | Out-String -Width 220 | Write-Host
          if ($results.Count -gt 0) { Write-Host "::error::PSScriptAnalyzer reported $($results.Count) finding(s)"; exit 1 }
          Write-Host 'PSScriptAnalyzer: no findings'

      - name: Matrix checks V1 to V14
        shell: pwsh
        run: ./tools/rulebook/Test-Rulebook.ps1

      - name: Pester
        shell: pwsh
        run: |
          Import-Module Pester -MinimumVersion 6.0
          $config = New-PesterConfiguration
          $config.Run.Path = 'tests'
          $config.Run.Exit = $true
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputFormat = 'NUnitXml'
          $config.TestResult.OutputPath = 'testResults.xml'
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: testResults
          path: testResults.xml
          if-no-files-found: warn

  validate-action:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate valid-minimal (must pass)
        uses: ./actions/Validate
        with:
          repositoryRoot: tests/fixtures/repos/valid-minimal
          checkForUpdates: 'false'

      - name: Validate template (must pass, no warnings)
        uses: ./actions/Validate
        with:
          repositoryRoot: template
          failOnWarning: 'true'
          checkForUpdates: 'false'

      - name: Validate stale-endpoints (must fail)
        id: stale
        continue-on-error: true
        uses: ./actions/Validate
        with:
          repositoryRoot: tests/fixtures/repos/stale-endpoints
          checkForUpdates: 'false'

      # A crash of the action also fails the step; requiring errors > 0 makes sure the checks themselves failed.
      - name: Require the stale-endpoints failure
        if: steps.stale.outcome != 'failure' || fromJSON(steps.stale.outputs.errors || '0') < 1
        shell: pwsh
        run: |
          Write-Host '::error::Validate did not report errors on tests/fixtures/repos/stale-endpoints'
          exit 1

  publish-action:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # deploy 'false' stages only: no Pages preflight, no deploy, no reachability check (the live run is documented
      # in docs/reference/publish-targets.md).
      - name: Stage template (must pass)
        id: stage
        uses: ./actions/Publish
        with:
          repositoryRoot: template
          baseUrl: https://example.github.io/rulebook
          deploy: 'false'

      - name: Check the staged files
        shell: pwsh
        env:
          STAGING_PATH: ${{ steps.stage.outputs.stagingPath }}
          PAGE_URL: ${{ steps.stage.outputs.pageUrl }}
        run: |
          $failures = [System.Collections.Generic.List[string]]::new()
          $endpoints = @(Get-ChildItem -LiteralPath (Join-Path $env:STAGING_PATH 'rulesets') -File)
          $skeletons = @(Get-ChildItem -LiteralPath (Join-Path $env:STAGING_PATH 'skeletons') -File)
          $top = @(Get-ChildItem -LiteralPath $env:STAGING_PATH | ForEach-Object Name | Sort-Object)
          if ($endpoints.Count -ne 12) { $failures.Add("expected 12 endpoints, found $($endpoints.Count)") }
          if ($skeletons.Count -ne 12) { $failures.Add("expected 12 skeletons, found $($skeletons.Count)") }
          if (($top -join ',') -cne 'index.html,rulebook.json,rulesets,skeletons') { $failures.Add("unexpected top level: $($top -join ', ')") }
          $skeleton = Get-Content -LiteralPath (Join-Path $env:STAGING_PATH 'skeletons' 'strict.ci.ruleset.json') -Raw
          if (-not $skeleton.Contains('"path": "https://example.github.io/rulebook/rulesets/strict.ci.ruleset.json"')) { $failures.Add('skeletons/strict.ci.ruleset.json does not carry the rendered URL') }
          if (-not (Get-Content -LiteralPath template/skeletons/strict.ci.ruleset.json -Raw).Contains('{BASEURL}')) { $failures.Add('template/skeletons/strict.ci.ruleset.json lost {BASEURL}') }
          if (Test-Path -LiteralPath (Join-Path $env:STAGING_PATH 'skeletons' 'README.md')) { $failures.Add('skeletons/README.md was staged') }
          $manifest = Get-Content -LiteralPath (Join-Path $env:STAGING_PATH 'rulebook.json') -Raw | ConvertFrom-Json
          if ($manifest.baseUrl -cne 'https://example.github.io/rulebook') { $failures.Add("rulebook.json has baseUrl '$($manifest.baseUrl)'") }
          if ($manifest.repository -cne $env:GITHUB_REPOSITORY) { $failures.Add("rulebook.json has repository '$($manifest.repository)'") }
          if ((@($manifest.levels.slug) -join ',') -cne 'essential,recommended,strict,complete') { $failures.Add("rulebook.json has the levels $(@($manifest.levels.slug) -join ', ')") }
          if ((@($manifest.stages.slug) -join ',') -cne 'default,ci,vnext') { $failures.Add("rulebook.json has the stages $(@($manifest.stages.slug) -join ', ')") }
          if (-not (Get-Content -LiteralPath (Join-Path $env:STAGING_PATH 'index.html') -Raw).Contains('<h2 id="al-project">')) { $failures.Add('index.html has no "Set up an AL project" section') }
          if ($env:PAGE_URL -cne 'https://example.github.io/rulebook/') { $failures.Add("pageUrl is '$($env:PAGE_URL)'") }
          foreach ($failure in $failures) { Write-Host "::error::$failure" }
          if ($failures.Count -gt 0) { exit 1 }
          Write-Host "Staged $($endpoints.Count) endpoints, $($skeletons.Count) skeletons, rulebook.json and index.html"

      # The init script over real HTTP: the staged site served from 127.0.0.1. The skeletons include
      # https://example.github.io/rulebook, so the script warns that the site was published with another baseUrl.
      - name: Serve the staged site
        shell: bash
        env:
          STAGING_PATH: ${{ steps.stage.outputs.stagingPath }}
        run: |
          nohup python3 -m http.server 8787 --directory "$STAGING_PATH" --bind 127.0.0.1 > "$RUNNER_TEMP/http-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/http-server.pid"
          for i in $(seq 1 20); do
            if curl -sSf -o /dev/null http://127.0.0.1:8787/rulebook.json; then echo "Serving $STAGING_PATH on http://127.0.0.1:8787"; exit 0; fi
            sleep 0.5
          done
          echo '::error::python3 -m http.server did not start'
          cat "$RUNNER_TEMP/http-server.log"
          exit 1

      - name: Init script against the staged site
        shell: pwsh
        env:
          STAGING_PATH: ${{ steps.stage.outputs.stagingPath }}
        run: |
          $failures = [System.Collections.Generic.List[string]]::new()
          $output = Join-Path $env:RUNNER_TEMP 'al' '.rulebook'
          $downloads = Join-Path $env:RUNNER_TEMP 'curl'
          [void](New-Item -ItemType Directory -Path $downloads -Force)
          $results = @(./scripts/Get-RulebookSkeletons.ps1 -BaseUrl http://127.0.0.1:8787 -Level strict -OutputPath $output -WarningVariable warnings)
          if ((@($results.Stage) -join ',') -cne 'default,ci,vnext') { $failures.Add("the script returned the stages $(@($results.Stage) -join ', ')") }
          if (@($warnings).Count -ne 3) { $failures.Add("expected 3 base URL warnings, got $(@($warnings).Count)") }
          foreach ($stage in 'default', 'ci', 'vnext') {
            $url = "http://127.0.0.1:8787/skeletons/strict.$stage.ruleset.json"
            $curlFile = Join-Path $downloads "$stage.ruleset.json"
            curl -sSf -o $curlFile $url
            if ($LASTEXITCODE -ne 0) { $failures.Add("curl failed on $url"); continue }
            $written = (Get-FileHash -LiteralPath (Join-Path $output "$stage.ruleset.json") -Algorithm SHA256).Hash
            $staged = (Get-FileHash -LiteralPath (Join-Path $env:STAGING_PATH 'skeletons' "strict.$stage.ruleset.json") -Algorithm SHA256).Hash
            $curled = (Get-FileHash -LiteralPath $curlFile -Algorithm SHA256).Hash
            if ($written -cne $staged -or $written -cne $curled) { $failures.Add(".rulebook/$stage.ruleset.json $written differs from the staged file $staged or the curl download $curled") }
            else { Write-Host ".rulebook/$stage.ruleset.json: SHA256 $written, equal to the staged file and the curl download" }
          }
          foreach ($failure in $failures) { Write-Host "::error::$failure" }
          if ($failures.Count -gt 0) { exit 1 }

      - name: Stop the server
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/http-server.pid" ]; then kill "$(cat "$RUNNER_TEMP/http-server.pid")" || true; fi

      - name: Upload the staging folder
        uses: actions/upload-artifact@v7
        with:
          name: publish-staging
          path: ${{ steps.stage.outputs.stagingPath }}
          if-no-files-found: error

      - name: Stage template without baseUrl (must fail)
        id: nobaseurl
        continue-on-error: true
        uses: ./actions/Publish
        with:
          repositoryRoot: template
          deploy: 'false'

      # The failure output names the reason, so a crash or another error does not count as the expected failure.
      - name: Require the empty baseUrl failure
        if: steps.nobaseurl.outcome != 'failure' || steps.nobaseurl.outputs.failure != 'baseUrl-empty'
        shell: pwsh
        env:
          FAILURE: ${{ steps.nobaseurl.outputs.failure }}
        run: |
          Write-Host "::error::Publish did not fail on template/ with an empty baseUrl (failure output: '$($env:FAILURE)')"
          exit 1

  update-action:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Check mode on the fixtures with local templates: no download, no token (tests/fixtures/templates/README.md).
      - name: Check update-org against v1 (no updates)
        id: unchanged
        uses: ./actions/CheckForUpdates
        with:
          repositoryRoot: tests/fixtures/repos/update-org
          templatePath: tests/fixtures/templates/v1
          installedTemplatePath: tests/fixtures/templates/v1

      - name: Check update-org against v2 (updates available)
        id: moved
        uses: ./actions/CheckForUpdates
        with:
          repositoryRoot: tests/fixtures/repos/update-org
          templatePath: tests/fixtures/templates/v2
          installedTemplatePath: tests/fixtures/templates/v1

      - name: Update without the token (must fail)
        id: notoken
        continue-on-error: true
        uses: ./actions/CheckForUpdates
        with:
          repositoryRoot: tests/fixtures/repos/update-org
          templatePath: tests/fixtures/templates/v2
          installedTemplatePath: tests/fixtures/templates/v1
          update: 'Y'

      # The outputs name the outcome, so a crash or another error does not pass.
      - name: Require the three outcomes
        if: steps.unchanged.outputs.updatesAvailable != 'false' || steps.moved.outputs.updatesAvailable != 'true' || steps.notoken.outcome != 'failure' || steps.notoken.outputs.failure != 'token'
        shell: pwsh
        env:
          UNCHANGED: ${{ steps.unchanged.outputs.updatesAvailable }}
          MOVED: ${{ steps.moved.outputs.updatesAvailable }}
          NOTOKEN: ${{ steps.notoken.outcome }}/${{ steps.notoken.outputs.failure }}
        run: |
          Write-Host "::error::CheckForUpdates outcomes: v1 updatesAvailable '$($env:UNCHANGED)' (expected false), v2 '$($env:MOVED)' (expected true), update without token '$($env:NOTOKEN)' (expected failure/token)"
          exit 1

  # The scan against the real packages on nuget.org (the unit suites use stub packages). Every run is a dry run: no
  # token, nothing pushed. nuget.org moves, so the checks are lower bounds and the log prints the numbers.
  scan-action:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare the fixtures
        id: fixtures
        shell: pwsh
        run: |
          . ./tests/Helpers/RepoFixture.ps1
          $scanOrg = New-FixtureRepo -Name 'scan-org' -Destination (Join-Path $env:RUNNER_TEMP 'scan-org')
          $template = Join-Path $env:RUNNER_TEMP 'template-policy'
          Copy-FixtureTree -Source template -Destination $template
          Edit-FixtureJson -Path (Join-Path $template '.github' 'Rulebook-Settings.json') -Script { $_['quarantine'] = [ordered]@{ stages = @('default', 'ci'); prereleaseStages = @('default', 'ci') } }
          # Without the seed titles of the compiler ids the scan must read them from CompilerDiagnosticsResources.
          Edit-FixtureJson -Path (Join-Path $template 'catalog' 'diagnostics.json') -Script { foreach ($entry in @($_['diagnostics'] | Where-Object { $_['analyzer'] -eq 'Compiler' })) { $entry.Remove('title') } }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "scanOrg=$scanOrg", "template=$template"

      - name: Scan template/ without a policy (must fail)
        id: nopolicy
        continue-on-error: true
        uses: ./actions/ScanDiagnostics
        with:
          repositoryRoot: template
          dryRun: 'true'

      - name: Require the policy failure
        if: steps.nopolicy.outcome != 'failure' || steps.nopolicy.outputs.failure != 'policy'
        shell: pwsh
        env:
          FAILURE: ${{ steps.nopolicy.outputs.failure }}
        run: |
          Write-Host "::error::ScanDiagnostics did not stop on template/ without a policy (failure output: '$($env:FAILURE)')"
          exit 1

      - name: Dry run on the template with a policy
        id: template
        uses: ./actions/ScanDiagnostics
        with:
          repositoryRoot: ${{ steps.fixtures.outputs.template }}
          dryRun: 'true'

      - name: Check the template scan
        shell: pwsh
        env:
          CANDIDATE: ${{ steps.template.outputs.candidatePath }}
          SCANNED: ${{ steps.template.outputs.scannedVersions }}
          NEW_IDS: ${{ steps.template.outputs.newIds }}
          FAILURE: ${{ steps.template.outputs.failure }}
        run: |
          Import-Module ./modules/Rulebook.Catalog.psd1, ./modules/Rulebook.Validate.psd1
          $failures = [System.Collections.Generic.List[string]]::new()
          if ($env:FAILURE) { $failures.Add("failure '$($env:FAILURE)'") }
          foreach ($package in 'microsoft.dynamics.businesscentral.development.tools@', 'alcops.analyzers@') {
            if (-not ($env:SCANNED.Split(',') | Where-Object { $_.StartsWith($package) -and $_.EndsWith(':stable') })) { $failures.Add("scannedVersions '$($env:SCANNED)' has no stable $package") }
          }
          $state = Join-Path $env:CANDIDATE 'catalog' 'scan-state.json'
          if (-not (Test-Json -Path $state -SchemaFile schemas/rulebook-scan-state.schema.json -ErrorAction SilentlyContinue)) { $failures.Add('catalog/scan-state.json does not match its schema') }
          $catalog = Read-CatalogFile -Path (Join-Path $env:CANDIDATE 'catalog' 'diagnostics.json')
          $withPackage = @($catalog.Entries.Values | Where-Object Package)
          if ($withPackage.Count -lt 600) { $failures.Add("only $($withPackage.Count) catalog entries have a package") }
          $untitled = @($catalog.Entries.Values | Where-Object { $_.Analyzer -eq 'Compiler' -and [string]::IsNullOrWhiteSpace($_.Title) } | ForEach-Object Id)
          if ($untitled.Count -gt 0) { $failures.Add("$($untitled.Count) compiler ids have no title after the scan (the CompilerDiagnosticsResources path): $(@($untitled | Select-Object -First 10) -join ', ')") }
          $errors = @(Test-Rulebook -RepositoryRoot $env:CANDIDATE | Where-Object Severity -EQ 'error')
          foreach ($finding in $errors) { $failures.Add("$($finding.Rule) $($finding.File) $($finding.Id): $($finding.Message)") }
          $unseen = @($catalog.Entries.Values | Where-Object { -not $_.Package } | ForEach-Object Id)
          $hidden = @($catalog.Entries.Values | Where-Object { -not $_.Advertised } | ForEach-Object Id)
          $seed = Read-CatalogFile -Path template/catalog/diagnostics.json
          $titles = @($catalog.Entries.Values | Where-Object { $seed.Entries.Contains($_.Id) -and $seed.Entries[$_.Id].Title -cne $_.Title }).Count
          $docs = @($catalog.Entries.Values | Where-Object { $seed.Entries.Contains($_.Id) -and $seed.Entries[$_.Id].Docs -cne $_.Docs } | ForEach-Object Id)
          Write-Host "Scanned: $($env:SCANNED)"
          Write-Host "New ids: $($env:NEW_IDS); entries with a package: $($withPackage.Count) of $($catalog.Entries.Count)"
          Write-Host "Refreshed from the seed: $titles titles, $($docs.Count) docs links ($($docs -join ', '))"
          Write-Host "Not advertised: $($hidden -join ', ')"
          Write-Host "Without a package: $($unseen -join ', ')"
          foreach ($failure in $failures) { Write-Host "::error::$failure" }
          if ($failures.Count -gt 0) { exit 1 }

      - name: Dry run on scan-org (30 catalog ids)
        id: org
        uses: ./actions/ScanDiagnostics
        with:
          repositoryRoot: ${{ steps.fixtures.outputs.scanOrg }}
          dryRun: 'true'

      - name: Check the scan-org scan
        shell: pwsh
        env:
          CANDIDATE: ${{ steps.org.outputs.candidatePath }}
          ORG: ${{ steps.fixtures.outputs.scanOrg }}
          NEW_IDS: ${{ steps.org.outputs.newIds }}
          FAILURE: ${{ steps.org.outputs.failure }}
        run: |
          Import-Module ./modules/Rulebook.Quarantine.psd1
          $failures = [System.Collections.Generic.List[string]]::new()
          if ($env:FAILURE) { $failures.Add("failure '$($env:FAILURE)'") }
          if ([int]$env:NEW_IDS -lt 500) { $failures.Add("only $($env:NEW_IDS) new ids") }
          foreach ($stage in 'default', 'ci') {
            $count = (Read-QuarantineFile -Path (Join-Path $env:CANDIDATE "quarantine.$stage.json")).Rules.Count
            Write-Host "quarantine.$stage.json: $count rules"
            if ($count -lt 500) { $failures.Add("quarantine.$stage.json has $count rules") }
          }
          if ((Get-FileHash (Join-Path $env:CANDIDATE 'quarantine.vnext.json')).Hash -ne (Get-FileHash (Join-Path $env:ORG 'quarantine.vnext.json')).Hash) { $failures.Add('quarantine.vnext.json changed') }
          foreach ($failure in $failures) { Write-Host "::error::$failure" }
          if ($failures.Count -gt 0) { exit 1 }

      - name: Dry run on the scanned template (nothing new)
        id: again
        uses: ./actions/ScanDiagnostics
        with:
          repositoryRoot: ${{ steps.template.outputs.candidatePath }}
          dryRun: 'true'

      - name: Require nothing-new within a minute
        if: steps.again.outputs.result != 'nothing-new' || fromJSON(steps.again.outputs.elapsedSeconds || '999') >= 60
        shell: pwsh
        env:
          RESULT: ${{ steps.again.outputs.result }}
          ELAPSED: ${{ steps.again.outputs.elapsedSeconds }}
        run: |
          Write-Host "::error::The second scan gave '$($env:RESULT)' in $($env:ELAPSED) s (expected nothing-new in under 60 s)"
          exit 1
